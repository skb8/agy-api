name: Go build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/agy-api-${os}-${arch}${suffix}" .
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: agy-api-binaries
          path: dist/
          if-no-files-found: error
